<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c2f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FEVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de teléfono; cabecera con puntaje en vivo, pasos de la salida arriba, navegación fija abajo. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#14213a; --muted:#5a6475; --line:#d6dbe4;
  --accent:#0c2f66; --accent-ink:#ffffff; --accent-soft:#e2e8f2; --gold:#b8944a; --gold-soft:#f3ead7;
  --good:#1f7a4a; --good-soft:#dcefe3; --warn:#a86400; --warn-soft:#f6e8cf; --bad:#b3302a; --bad-soft:#f6dedc;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
    --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
    --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
  --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
  --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px}
.wrap{max-width:580px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:38px;width:auto;flex:none;background:#fff;border-radius:6px;padding:3px 5px}
#brandt{font-size:15px;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.live{text-align:right;font-variant-numeric:tabular-nums}
.live b{font-family:var(--display);font-size:24px;line-height:1}
.live span{display:block;font-size:12px;color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;margin:20px 0 4px}
h3{font-size:16px;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin:14px 0 0}
.steps button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 4px;font:500 12px var(--body);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);color:var(--accent-ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea{font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:64px;resize:vertical}
select{font:400 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:55%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:20px}
.blockhead span{font-size:13px;color:var(--muted);white-space:nowrap}
.item{border-top:1px solid var(--line);padding:12px 0 2px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item-t{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.num{flex:none;width:24px;height:24px;border-radius:6px;background:var(--gold-soft);color:var(--ink);font:700 13px var(--display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tag{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.crit{background:var(--bad-soft);color:var(--bad)}
.tag.ej{background:var(--warn-soft);color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 6px;font:500 14px var(--body);cursor:pointer;min-height:44px}
.seg button[data-v="na"]{color:var(--muted);padding:10px 12px}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);border-color:var(--warn);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.add{border-style:dashed;color:var(--accent)}
.oflab{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.ofs{display:flex;flex-wrap:wrap;gap:6px}
.ofs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;min-height:38px}
.ofs button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.ofs button[aria-pressed="true"]::before{content:"\2713\00a0"}
.lrow{display:flex;gap:8px;align-items:center}
.ed .l{flex-wrap:wrap}
.gh{font:700 13px var(--display,inherit);letter-spacing:.06em;text-transform:uppercase;color:var(--gold,#b8944a);padding:14px 0 2px;border-top:2px solid var(--line)}
.gh:first-child{border-top:0;padding-top:2px}
.idesc{font-size:13.5px;color:var(--muted);padding-left:32px}
.lobj{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;border-top:1px solid var(--line);padding-top:12px}
.lobj:first-child{border-top:0;padding-top:0}
.lobj .wide{grid-column:1/-1}
.foto{max-width:100%;max-height:280px;border-radius:10px;border:1px solid var(--line);display:block}
.filebtn{display:inline-block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+*, div:has(>.vh:focus-visible) .filebtn{outline:3px solid var(--accent);outline-offset:2px}
.cresw{display:flex;flex-direction:column;gap:6px}
.cres{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:400 15px var(--body);cursor:pointer}
.cres span{font-size:13px;color:var(--muted)}
.mods{display:grid;gap:10px;margin-top:12px}
.mod{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);color:var(--ink);font:inherit}
.mod.on{cursor:pointer;border-left:6px solid var(--gold)}
a.mod{text-decoration:none}
.mod.on:hover{border-color:var(--accent);border-left-color:var(--gold)}
.mod.off{opacity:.65}
.mod .mt{font:800 18px var(--display)}
.mod .md{font-size:14px;color:var(--muted)}
.mod .mc{font-weight:600;color:var(--accent)}
.mod .tag{align-self:flex-start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.f select{max-width:100%;width:100%}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:13px 14px;font:600 15px var(--body);cursor:pointer;min-width:140px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{flex:none;min-width:0;padding:8px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.score{display:flex;align-items:center;gap:16px}
.score .big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.bar i{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.bar i b{display:block;height:100%;border-radius:4px}
.bar .v{font-weight:600;font-variant-numeric:tabular-nums}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.fb{border-left:4px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.fb.ok{border-color:var(--good)}
.fb .k{font-weight:600}
.fb .d{font-size:14px;color:var(--muted)}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.hist:first-child{border-top:0;padding-top:0}
.hist .n{font:800 24px var(--display);font-variant-numeric:tabular-nums}
.hist .m{font-size:13px;color:var(--muted)}
.ed{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ed:first-of-type{border-top:0;padding-top:0}
.ed .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ed .l label{display:flex;align-items:center;gap:6px}
.wt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.wt input{width:76px}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav.tabs .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:12px 6px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;display:none;max-width:90%}
@media (max-width:380px){.row2{grid-template-columns:1fr}.seg button{font-size:13px;padding:10px 2px}}
</style>
</head>

function isNum(v){return typeof v==="number"}
function ratio(blk,id){
  if(blk==="prep"){var v=ev.prep[id];return isNum(v)?v/2:null}
  var a=ev.clientes.map(function(c){return c[blk][id]}).filter(isNum);
  return a.length?a.reduce(function(x,y){return x+y},0)/a.length/2:null;
}
function calc(){
  var out={blocks:{},items:[],answered:0,count:0},wsum=0,acc=0;
  BLK.forEach(function(blk){
    var rs=[];
    pauta[blk].forEach(function(it,i){
      var r=ratio(blk,it.id);
      out.items.push({blk:blk,n:i+1,t:it.t,fb:it.fb,crit:it.crit,r:r});
      if(r!==null)rs.push(r);
    });
    var br=rs.length?rs.reduce(function(x,y){return x+y},0)/rs.length:null;
    out.blocks[blk]=br;
    var w=Number(pauta.pesos[blk])||0;
    if(br!==null){wsum+=w;acc+=w*br}
    if(blk==="prep"){out.count+=pauta.prep.length;pauta.prep.forEach(function(it){if(ev.prep[it.id]!==undefined)out.answered++})}
    else ev.clientes.forEach(function(c){out.count+=pauta[blk].length;pauta[blk].forEach(function(it){if(c[blk][it.id]!==undefined)out.answered++})});
  });
  out.total=wsum?Math.round(acc/wsum*100):null;
  var w=function(x){return Number(pauta.pesos[x.blk])||0};
  out.prio=out.items.filter(function(x){return x.r!==null&&x.r<0.999}).sort(function(a,b){
    var ca=a.crit&&a.r<=0.5?0:1,cb=b.crit&&b.r<=0.5?0:1;
    return ca-cb||a.r-b.r||w(b)-w(a)}).slice(0,3);
  out.fort=out.items.filter(function(x){return x.r!==null&&x.r>=0.999}).sort(function(a,b){
    return (b.crit?1:0)-(a.crit?1:0)||w(b)-w(a)}).slice(0,2);
  out.crit=out.items.filter(function(x){return x.crit&&x.r!==null&&x.r<0.5});
  return out;
}

  else if(a==="resetpauta"){pauta=clone(DEF);save("feval_pauta",pauta);render();toast("Pauta de ejemplo restaurada.")}
});
document.addEventListener("input",function(e){
  var t=e.target,k=t.dataset.bind;
  if(k){
    if(k==="cli"){var cc=ev.clientes[ci];cc.nombre=t.value;cc.cod="";cc.com="";cc.cl="";cc.cv="";var rr=document.getElementById("cli-res");if(rr)rr.innerHTML=cliRes(t.value)}
    else if(k==="cobs")ev.clientes[ci].obs=t.value;else ev[k]=t.value;
    save("feval_eval",ev);
    if(k==="c1"||k==="c2"||k==="fc"){var ta=document.getElementById("f-res");if(ta)ta.value=resumen(calc())}
    return;
  }
  if(t.dataset.ed){var it=pauta[t.dataset.blk][Number(t.dataset.i)];
    if(t.type==="checkbox")it[t.dataset.ed]=t.checked;else it[t.dataset.ed]=t.value;
    save("feval_pauta",pauta);return}
  if(t.dataset.lst){if(t.dataset.f)pauta[t.dataset.lst][Number(t.dataset.i)][t.dataset.f]=t.value.trim();else pauta[t.dataset.lst][Number(t.dataset.i)]=t.value.trim();save("feval_pauta",pauta);return}
  if(t.dataset.w){pauta.pesos[t.dataset.w]=Math.max(0,Number(t.value)||0);save("feval_pauta",pauta)}
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="f-foto"){if(t.files&&t.files[0])cargarFoto(t.files[0]);return}
  if(t.dataset.w)render();
  else if(t.dataset.bind==="fecha"){autoruta();save("feval_eval",ev);render()}
  else if(t.dataset.eq){eq.vend[Number(t.dataset.eq)].sup=t.value;save("feval_equipo",eq)}
  else if(t.dataset.eqs){var i=Number(t.dataset.eqs),old=eq.sups[i],nw=t.value.trim();if(!nw){t.value=old;return}
    eq.sups[i]=nw;eq.vend.forEach(function(v){if(v.sup===old)v.sup=nw});if(ev.sup===old){ev.sup=nw;save("feval_eval",ev)}save("feval_equipo",eq);render()}
});
render();
function arranque(){
if(GS)GS.withSuccessHandler(function(r){CLI=r||[];CN=null;var rr=document.getElementById("cli-res"),cc=ev.clientes[ci];if(rr&&cc&&!cc.cod)rr.innerHTML=cliRes(cc.nombre)})
  .withFailureHandler(function(){CLIERR="No se pudo cargar la maestra de clientes. Escribe el nombre a mano o vuelve a abrir la app.";var rr=document.getElementById("cli-res");if(rr)rr.innerHTML=cliRes("")}).getClientes();
if(GS)GS.withSuccessHandler(function(j){if(!j)return;try{var c=JSON.parse(j);
  if(c.pauta){pauta=c.pauta;migrarNestle(pauta);save("feval_pauta",pauta)}
  if(c.eq){eq=c.eq;save("feval_equipo",eq)}
  render()}catch(e){}}).getConfig();
}
if(sesion())arranque();
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="lg-p"){var lb=document.querySelector('[data-act="login"]');if(lb)lb.click()}});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
