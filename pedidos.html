<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c2f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Catálogo y Pedidos · FEVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#14213a; --muted:#5a6475; --line:#d6dbe4;
  --accent:#0c2f66; --accent-ink:#ffffff; --accent-soft:#e2e8f2; --gold:#b8944a; --gold-soft:#f3ead7;
  --good:#1f7a4a; --good-soft:#dcefe3; --warn:#a86400; --warn-soft:#f6e8cf; --bad:#b3302a; --bad-soft:#f6dedc;
  --wa:#128c4a;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
    --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
    --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
    --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321; --wa:#3fbf7a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:150px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:38px;width:auto;flex:none;background:#fff;border-radius:6px;padding:3px 5px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;margin:20px 0 4px}
h3{font-size:16px}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;margin:14px 0 0}
.steps button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 4px;font:500 13px var(--body);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);color:var(--accent-ink);font-weight:600}
.steps button:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],textarea,select{font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:20px}
.blockhead span{font-size:13px;color:var(--muted);white-space:nowrap}
.cres{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:400 15px var(--body);cursor:pointer}
.cres span{font-size:13px;color:var(--muted)}
.cresw{display:flex;flex-direction:column;gap:6px}
.sel{border:2px solid var(--good);background:var(--good-soft);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sel b{display:block}
.sel span{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none}
.btn{flex:1;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:13px 14px;font:600 15px var(--body);cursor:pointer;min-width:140px;text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{flex:none;min-width:0;padding:8px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 14px var(--body);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.subc button{font-size:13px;padding:5px 11px}
.srch{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:6px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pc.on{border:2px solid var(--good);padding:9px}
.pc .ph{height:118px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden}
.pc .ph img{max-width:100%;max-height:118px;object-fit:contain}
.pc .nm{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em}
.pc .cd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pr{font-size:13px;font-variant-numeric:tabular-nums}.pr b{font-size:15px}.pr.sin{color:var(--muted);font-size:12px}
.totbox{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:2px solid var(--line);padding-top:10px}
.totbox b{font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:4px}
.stp button.q{width:40px;height:40px;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:700 20px var(--body);cursor:pointer;line-height:1}
.stp input{width:100%;min-width:0;text-align:center;padding:8px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.ut{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ut button{flex:1;border:0;background:var(--bg);color:var(--muted);font:600 13px var(--body);padding:7px 4px;cursor:pointer}
.ut button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ut button:disabled{opacity:.4;cursor:default}
.eq{font-size:12px;color:var(--muted);min-height:1.2em;font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column;gap:0}
.ln{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.ln img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.ln .nm{font-weight:600;font-size:14px}
.ln .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ln .ctl .stp{width:150px}
.ln .ctl .ut{width:120px}
.msg{white-space:pre-wrap;font:400 14px/1.5 var(--body);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.cart{position:fixed;left:0;right:0;bottom:64px;z-index:6;pointer-events:none}
.cart .wrap{pointer-events:auto}
.cart button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:14px 16px;font:600 15px var(--body);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cart button b{font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:7}
nav.tabs .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
nav.tabs button,nav.tabs a{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:12px 6px;border-radius:8px;cursor:pointer;text-align:center;text-decoration:none}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.pend{background:var(--warn-soft);color:var(--warn)}
.hi{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.hi:first-child{border-top:0}
.hi .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px;font-size:14px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

var ULTREG=null;
function guardar(){save("fe_ped_cur",ped)}

function cm(code){var i=BYC[code];return i>=0?CAT[i][4]:0}
function dsp(code){var i=BYC[code];return i>=0?CAT[i][7]||0:0}
function pu(code){var i=BYC[code];return i>=0?CAT[i][6]||0:0}
function clp(n){return "$"+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function sub(code){return unid(code)*pu(code)}
function precioHTML(p){if(!p[6])return '<div class="pr sin">Sin precio en la lista</div>';
  return '<div class="pr"><b>'+clp(p[6])+"</b> "+(p[7]?"display de "+p[7]:"c/u")+(p[4]?' · caja '+clp(p[6]*p[4]):"")+"</div>"}
function total(){var t=0,sp=0;ped.ord.forEach(function(c){if(!(ped.it[c]&&ped.it[c].q))return;if(pu(c))t+=sub(c);else sp++});return{t:t,sp:sp}}
function unid(code){var x=ped.it[code];if(!x)return 0;return x.u==="cj"?x.q*(cm(code)||1):x.q}
function nLineas(){return ped.ord.filter(function(c){return ped.it[c]&&ped.it[c].q>0}).length}
function setQ(code,q,u){q=Math.max(0,Math.min(9999,Math.round(Number(q)||0)));
  var x=ped.it[code]||{q:0,u:"un"};if(u)x.u=u;x.q=q;
  if(q>0){ped.it[code]=x;if(ped.ord.indexOf(code)<0)ped.ord.push(code)}
  else{delete ped.it[code];ped.ord=ped.ord.filter(function(c){return c!==code});if(u){ped.it[code]={q:0,u:u}}}
  guardar()}
function qtyTxt(code){var x=ped.it[code];if(!x||!x.q)return "";var c=cm(code);
  return (x.u==="cj"?x.q+(x.q===1?" caja":" cajas")+(c?" ("+x.q*c+" un)":""):(dsp(code)?x.q+(x.q===1?" display":" displays")+" de "+dsp(code):x.q+(x.q===1?" unidad":" unidades")))+(pu(code)?" · "+clp(sub(code)):"")}

function render(){
  var m=document.getElementById("main");
  m.innerHTML=view==="hist"?vHist():vPedido();
  document.querySelectorAll("nav.tabs button").forEach(function(b){if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  cartBar()}
function cartBar(){var c=document.getElementById("cart"),n=nLineas();
  if(view!=="pedido"||stage!==1||!n){c.innerHTML="";return}
  c.innerHTML='<div class="wrap"><button type="button" data-act="stage" data-s="2"><span><b>'+n+"</b> "+(n===1?"producto":"productos")+" · <b>"+clp(total().t)+"</b></span><span>Revisar y enviar ›</span></button></div>"}

function stepsHTML(){var ok=cliOk(),n=nLineas();
  return '<div class="steps">'+
    '<button type="button" data-act="stage" data-s="0"'+(stage===0?' aria-current="step"':"")+">1 · Cliente</button>"+
    '<button type="button" data-act="stage" data-s="1"'+(stage===1?' aria-current="step"':"")+(ok?"":" disabled")+">2 · Productos"+(n?" ("+n+")":"")+"</button>"+
    '<button type="button" data-act="stage" data-s="2"'+(stage>=2?' aria-current="step"':"")+(ok&&n?"":" disabled")+">3 · Enviar</button></div>"}
function cliOk(){return ped.nuevo?!!(ped.cli.trim()&&ped.vend):!!(ped.cod&&ped.vend)}

function vPedido(){
  if(stage===3)return vFin();
  var h="<h2>Tomar pedido</h2>"+stepsHTML();
  if(stage===0)return h+vCliente();
  if(stage===1)return h+vCatalogo();
  return h+vRevisar()}

function vendSel(){var o='<option value="">Elige el vendedor</option>';
  VN.slice().sort().forEach(function(n){o+="<option"+(n===ped.vend?" selected":"")+">"+esc(n)+"</option>"});
  if(ped.vend&&VN.indexOf(ped.vend)<0)o+="<option selected>"+esc(ped.vend)+"</option>";
  return '<label class="f">Vendedor que digitará el pedido<select data-in="vend">'+o+"</select></label>"}

function vCliente(){var h='<div class="card">';
  if(!ped.nuevo){
    if(ped.cod){
      h+='<div class="sel"><div><b>'+esc(ped.cli)+"</b><span>"+esc(ped.cod)+(ped.com?" · "+esc(ped.com):"")+" · cluster "+esc(ped.cl||"sin dato")+"</span></div>"+
        '<button type="button" class="btn ghost small" data-act="cambiacli">Cambiar</button></div>'
    }else{
      h+='<label class="f">Busca el cliente por nombre o código<input type="search" id="cq" autocomplete="off" placeholder="Ej.: almacén rosita o 12345" value="'+esc(cq)+'"></label><div class="cresw" id="cres">'+cresHTML()+"</div>"}
  }else{
    h+='<label class="f">Nombre del local<input type="text" data-in="cli" value="'+esc(ped.cli)+'" placeholder="Nombre de fantasía o razón social"></label>'+
      '<label class="f">RUT<input type="text" data-in="rut" value="'+esc(ped.rut)+'" placeholder="12.345.678-9"></label>'+
      '<label class="f">Dirección y comuna<input type="text" data-in="dir" value="'+esc(ped.dir)+'"></label>'+
      '<p class="sub">El vendedor debe crear el cliente en el sistema antes de digitar el pedido.</p>'}
  h+='<label class="chk"><input type="checkbox" data-in="nuevo"'+(ped.nuevo?" checked":"")+"> Cliente nuevo: no está en la maestra</label>";
  h+=vendSel();
  if(ped.cod&&ped.cvend&&ped.vend&&ped.cvend!==ped.vend)h+='<p class="warnbox">En la maestra este cliente es de '+esc(ped.cvend)+".</p>";
  if(ped.cod&&!ped.cvend&&!ped.vend)h+='<p class="warnbox">Este cliente no tiene vendedor en la maestra. Elige quién digitará el pedido.</p>';
  h+='<div class="row"><button type="button" class="btn" data-act="stage" data-s="1"'+(cliOk()?"":" disabled")+">Elegir productos</button></div></div>";
  if(nLineas())h+='<p class="sub" style="margin-top:10px">Hay '+nLineas()+' productos cargados. <button type="button" class="btn ghost small" data-act="vaciar">Vaciar pedido</button></p>';
  return h}
function cresHTML(){if(norm(cq).trim().length<2)return "";
  if(!CLIRAW.length)return '<p class="sub">'+esc(CLIERR||"Cargando la maestra de clientes…")+"</p>";
  var r=buscarCli(cq);
  if(!r.length)return '<p class="sub">No hay clientes activos con ese nombre o código. Si es un cliente nuevo, marca la casilla de abajo.</p>';
  return r.map(function(i){var c=CLIRAW[i];return '<button type="button" class="cres" data-act="pickcli" data-i="'+i+'"><b>'+esc(c[1])+"</b><span>"+esc(c[0])+" · "+esc(c[2])+" · cluster "+esc(c[3]||"sin dato")+" · "+esc(c[4]||"sin vendedor")+"</span></button>"}).join("")}

function filtrar(){var ws=norm(fq).trim().split(/\s+/).filter(Boolean),r=[];
  for(var i=0;i<CAT.length;i++){var p=CAT[i];
    if(soloPed&&!(ped.it[p[0]]&&ped.it[p[0]].q))continue;
    if(!soloPed&&!ws.length){if(fcat&&p[2]!==fcat)continue;if(fsub&&p[3]!==fsub)continue}
    if(ws.length&&!ws.every(function(w){return CN[i].indexOf(w)>=0}))continue;
    r.push(i)}
  return r}
function vCatalogo(){
  var h='<div class="srch"><input type="search" id="fq" autocomplete="off" placeholder="Buscar producto o código ERP" value="'+esc(fq)+'">'+
    '<div class="chips" style="margin-top:8px"><button type="button" data-act="fcat" data-c=""'+(!fcat&&!soloPed?' aria-pressed="true"':"")+">Todos</button>"+
    '<button type="button" data-act="solo"'+(soloPed?' aria-pressed="true"':"")+">En el pedido ("+nLineas()+")</button>";
  CATS.forEach(function(c){h+='<button type="button" data-act="fcat" data-c="'+esc(c)+'"'+(fcat===c&&!soloPed?' aria-pressed="true"':"")+">"+esc(c)+"</button>"});
  h+="</div>";
  if(fcat&&!soloPed){var subs=[];CAT.forEach(function(p){if(p[2]===fcat&&subs.indexOf(p[3])<0)subs.push(p[3])});
    if(subs.length>1){h+='<div class="chips subc"><button type="button" data-act="fsub" data-c=""'+(!fsub?' aria-pressed="true"':"")+">Todas</button>";
      subs.forEach(function(s){h+='<button type="button" data-act="fsub" data-c="'+esc(s)+'"'+(fsub===s?' aria-pressed="true"':"")+">"+esc(s)+"</button>"});h+="</div>"}}
  h+='</div><p class="sub" style="margin-top:8px">'+esc(ped.cli)+" · vendedor "+esc(ped.vend)+'</p><div id="grid">'+gridHTML()+"</div>";
  return h}
function gridHTML(){var r=filtrar();
  if(!r.length)return '<p class="empty">'+(soloPed?"Todavía no agregas productos.":"No hay productos con esa búsqueda.")+"</p>";
  return '<div class="grid">'+r.map(cardHTML).join("")+"</div>"}
function stpHTML(code){var x=ped.it[code]||{q:0,u:"un"},c=cm(code);
  return '<div class="stp"><button type="button" class="q" data-act="menos" data-c="'+esc(code)+'" aria-label="Restar uno">−</button>'+
    '<input type="text" inputmode="numeric" data-qty="'+esc(code)+'" value="'+(x.q||"")+'" placeholder="0" aria-label="Cantidad">'+
    '<button type="button" class="q" data-act="mas" data-c="'+esc(code)+'" aria-label="Sumar uno">+</button></div>'+
    '<div class="ut"><button type="button" data-act="unit" data-u="un" data-c="'+esc(code)+'" aria-pressed="'+(x.u!=="cj")+'">'+(dsp(code)?"Displays":"Unidades")+'</button>'+
    '<button type="button" data-act="unit" data-u="cj" data-c="'+esc(code)+'" aria-pressed="'+(x.u==="cj")+'"'+(c?"":" disabled")+">Cajas</button></div>"}
function cardHTML(i){var p=CAT[i],x=ped.it[p[0]],on=x&&x.q>0;
  return '<div class="pc'+(on?" on":"")+'" data-card="'+esc(p[0])+'"><div class="ph"><img loading="lazy" src="cat/'+esc(p[5])+'.jpg" alt=""></div>'+
    '<div class="nm">'+esc(p[1])+'</div><div class="cd">ERP '+esc(p[0])+(p[4]?" · caja de "+p[4]:"")+"</div>"+precioHTML(p)+stpHTML(p[0])+
    '<div class="eq" data-eq="'+esc(p[0])+'">'+esc(qtyTxt(p[0]))+"</div></div>"}
function updCard(code){
  document.querySelectorAll('[data-card="'+code+'"]').forEach(function(el){var i=BYC[code];
    var tmp=document.createElement("div");tmp.innerHTML=stage===1?cardHTML(i):lineHTML(code);var nw=tmp.firstChild;
    if(stage===1){el.className=nw.className;el.querySelector(".stp").outerHTML=nw.querySelector(".stp").outerHTML;el.querySelector(".ut").outerHTML=nw.querySelector(".ut").outerHTML;el.querySelector(".eq").textContent=qtyTxt(code)}
    else el.replaceWith(nw)});
  cartBar();
  var sb=document.querySelector('[data-act="solo"]');if(sb)sb.textContent="En el pedido ("+nLineas()+")";
  var st=document.querySelector(".steps");if(st){var t=document.createElement("div");t.innerHTML=stepsHTML();st.replaceWith(t.firstChild)}
  if(stage===2){var tl=document.getElementById("tot");if(tl)tl.textContent=totTxt();var tv=document.getElementById("totv");if(tv)tv.textContent=clp(total().t)}}

function lineHTML(code){var i=BYC[code],p=CAT[i];
  return '<div class="ln" data-card="'+esc(code)+'"><img src="cat/'+esc(p[5])+'.jpg" alt=""><div><div class="nm">'+esc(p[1])+'</div><div class="sub" style="font-size:12px">ERP '+esc(code)+(p[4]?" · caja de "+p[4]:"")+'</div>'+precioHTML(p)+
    '<div class="ctl">'+stpHTML(code)+'<button type="button" class="btn danger small" data-act="quitar" data-c="'+esc(code)+'">Quitar</button></div>'+
    '<div class="eq">'+esc(qtyTxt(code))+"</div></div></div>"}
function totTxt(){var n=nLineas(),u=0;ped.ord.forEach(function(c){u+=unid(c)});var T=total();return n+(n===1?" producto · ":" productos · ")+u+" unidades · "+clp(T.t)+(T.sp?" (+"+T.sp+" sin precio)":"")}
function vRevisar(){var cs=ped.ord.filter(function(c){return ped.it[c]&&ped.it[c].q>0});
  var h='<div class="blockhead"><h3>'+esc(ped.cli)+'</h3><span id="tot">'+esc(totTxt())+"</span></div>"+
    '<p class="sub">'+(ped.nuevo?"Cliente nuevo":esc(ped.cod))+" · vendedor "+esc(ped.vend)+"</p>";
  h+='<div class="card"><div class="lines">'+cs.map(lineHTML).join("")+"</div>"+
    '<div class="totbox"><span>Total referencial<br><span class="sub" style="font-size:12px">Según la lista de precios de octubre. El precio final lo pone el sistema.</span></span><b id="totv">'+clp(total().t)+"</b></div>"+
    '<div><button type="button" class="btn ghost small" data-act="stage" data-s="1">+ Agregar más productos</button></div></div>';
  h+='<div class="card"><label class="f">Observación para el vendedor (opcional)<textarea data-in="obs" placeholder="Ej.: entregar el jueves, pide factura, pagar con transferencia">'+esc(ped.obs)+"</textarea></label></div>";
  h+='<div class="row" style="margin-top:14px"><button type="button" class="btn" data-act="finalizar"'+(cs.length?"":" disabled")+">Finalizar pedido</button></div>"+
    '<p class="sub" style="margin-top:8px">Al finalizar se guarda en tu historial y en la planilla, y te muestra el texto listo para copiar y pegar en el WhatsApp del vendedor.</p>';
  return h}

function textoPedido(r){var L=["*Pedido FEVAL* · "+fCL(r.f),"*Cliente:* "+(r.cod?r.cod+" · ":"")+r.cli+(r.com?" ("+r.com+")":"")];
  if(r.nuevo){L.push("*Cliente nuevo* (crear en el sistema)"+(r.rut?" · RUT "+r.rut:""));if(r.dir)L.push("*Dirección:* "+r.dir)}
  L.push("*Vendedor:* "+r.vend,"*Tomado por:* "+r.sup,"");
  r.l.forEach(function(x,i){L.push((i+1)+". "+x.c+" · "+x.n+" · "+x.t)});
  L.push("","*Total:* "+r.l.length+(r.l.length===1?" producto":" productos")+" · "+r.uni+" unidades");
  if(r.tot)L.push("*Total referencial:* "+clp(r.tot)+(r.sp?" ("+r.sp+" sin precio)":"")+" · precio lista");
  if(r.obs)L.push("*Obs:* "+r.obs);
  return L.join("\n")}
function finalizar(){var cs=ped.ord.filter(function(c){return ped.it[c]&&ped.it[c].q>0});if(!cs.length)return;
  var u=0,l=cs.map(function(c){var x=ped.it[c],p=CAT[BYC[c]];u+=unid(c);return{c:c,n:p[1],q:x.q,u:x.u,cm:p[4],un:unid(c),t:qtyTxt(c),pu:pu(c),st:sub(c)}});
  var r={id:"P"+Date.now().toString(36).toUpperCase(),f:ahora(),sup:SES.n,cod:ped.cod,cli:ped.cli.trim(),com:ped.com,cl:ped.cl,vend:ped.vend,nuevo:ped.nuevo,rut:ped.rut,dir:ped.dir,obs:ped.obs.trim(),l:l,uni:u,tot:total().t,sp:total().sp,st:"pend"};
  r.txt=textoPedido(r);
  HIST.unshift(r);HIST=HIST.slice(0,200);save("fe_ped_hist",HIST);
  ULTREG=r.id;ped=nuevo();guardar();cq="";fq="";soloPed=false;stage=3;render();window.scrollTo(0,0);enviarCola()}
function vFin(){var r=HIST.filter(function(x){return x.id===ULTREG})[0];if(!r){stage=0;return vPedido()}
  return "<h2>Pedido listo</h2><p class=\"sub\">"+esc(r.cli)+" · "+r.l.length+" productos · vendedor "+esc(r.vend)+"</p>"+
    '<div class="card"><div class="row"><button type="button" class="btn" data-act="copiar" data-id="'+r.id+'">Copiar pedido</button>'+
    '<a class="btn wa" href="https://wa.me/?text='+encodeURIComponent(r.txt)+'" target="_blank" rel="noopener">Abrir WhatsApp</a></div>'+
    '<p class="sub">Copia y pégalo en el chat de '+esc(r.vend)+'. "Abrir WhatsApp" deja el texto escrito y tú eliges el chat. La copia para ti queda en el Historial.</p>'+
    '<div class="msg">'+esc(r.txt)+"</div></div>"+
    '<p class="sub" style="margin-top:10px">'+estadoTxt(r)+'</p><div class="row" style="margin-top:14px"><button type="button" class="btn ghost" data-act="otro">Tomar otro pedido</button></div>'}
function estadoTxt(r){return r.st==="ok"?"Guardado en la planilla.":r.st==="err"?"Guardado solo en este teléfono: "+esc(r.err||"la planilla no lo aceptó")+".":"Guardado en este teléfono. Se sube a la planilla apenas haya señal."}

function vHist(){var h='<h2>Historial de pedidos</h2><p class="sub">Los pedidos que tomaste en este teléfono. No entran al resumen del gerente.</p>';
  if(!HIST.length)return h+'<div class="card"><p class="empty">Todavía no tomas pedidos.</p></div>';
  var hoyS=ahora().slice(0,10),nh=HIST.filter(function(x){return x.f.slice(0,10)===hoyS}).length;
  h+='<p class="sub" style="margin-top:6px"><b>'+nh+"</b> hoy · <b>"+HIST.length+"</b> en total</p>";
  h+='<div class="card">'+HIST.map(function(r){
    return '<div class="hi"><div class="t"><b>'+esc(r.cli)+'</b><span class="tag '+(r.st==="ok"?"ok":"pend")+'">'+(r.st==="ok"?"En planilla":r.st==="err"?"Solo en teléfono":"Pendiente de subir")+"</span></div>"+
      '<span class="sub">'+esc(fCL(r.f))+" · "+r.l.length+" productos · "+r.uni+" un · vendedor "+esc(r.vend)+"</span>"+
      '<div class="row"><button type="button" class="btn small" data-act="copiar" data-id="'+r.id+'">Copiar</button>'+
      '<a class="btn small wa" href="https://wa.me/?text='+encodeURIComponent(r.txt)+'" target="_blank" rel="noopener">WhatsApp</a>'+
      '<button type="button" class="btn ghost small" data-act="repetir" data-id="'+r.id+'">Repetir pedido</button>'+
      '<button type="button" class="btn ghost small" data-act="ver" data-id="'+r.id+'">Ver</button></div>'+
      (r.ver?'<div class="msg">'+esc(r.txt)+"</div>":"")+"</div>"}).join("")+"</div>";
  return h}

function copiar(t){
  function viejo(){var a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);toast(ok?"Pedido copiado. Pégalo en WhatsApp.":"No se pudo copiar. Usa \"Abrir WhatsApp\".")}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){toast("Pedido copiado. Pégalo en WhatsApp.")},viejo);else viejo()}

var enviando=false;
function enviarCola(){if(enviando)return;var p=HIST.filter(function(x){return x.st==="pend"});if(!p.length)return;enviando=true;
  var r=p[p.length-1],o=JSON.parse(JSON.stringify(r));delete o.st;delete o.ver;delete o.err;
  api("guardarPedido",[o]).then(function(){r.st="ok";save("fe_ped_hist",HIST);enviando=false;refrescar();enviarCola()},
    function(e){enviando=false;var m=String(e&&e.message||e);
      if(/desconocida/i.test(m)){r.st="err";r.err="falta actualizar el Código en la planilla";save("fe_ped_hist",HIST);refrescar()}})}
function refrescar(){if((view==="hist"||stage===3)&&quieto())render()}
function quieto(){var a=document.activeElement;return !(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))}
var tt;function toast(s){var t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(tt);tt=setTimeout(function(){t.style.display="none"},2600)}

document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,c=b.dataset.c;
  if(a==="view"){view=b.dataset.v;if(view==="pedido"&&stage===3)stage=0;render();window.scrollTo(0,0)}
  else if(a==="stage"){var s=Number(b.dataset.s);if(s>=1&&!cliOk())return;if(s===2&&!nLineas())return;stage=s;render();window.scrollTo(0,0)}
  else if(a==="pickcli"){var r=CLIRAW[Number(b.dataset.i)];ped.cod=r[0];ped.cli=r[1];ped.com=r[2];ped.cl=r[3];ped.cvend=r[4]||"";ped.vend=r[4]||ped.vend;guardar();render()}
  else if(a==="cambiacli"){ped.cod="";ped.cli="";ped.com="";ped.cl="";ped.cvend="";guardar();render();var q=document.getElementById("cq");if(q)q.focus()}
  else if(a==="vaciar"){ped.it={};ped.ord=[];guardar();render();toast("Pedido vaciado.")}
  else if(a==="fcat"){fcat=c;fsub="";soloPed=false;fq="";render()}
  else if(a==="fsub"){fsub=c;render()}
  else if(a==="solo"){soloPed=!soloPed;render()}
  else if(a==="mas"||a==="menos"){var x=ped.it[c]||{q:0,u:"un"};setQ(c,x.q+(a==="mas"?1:-1));if(stage===2&&!(ped.it[c]&&ped.it[c].q)){render();return}updCard(c)}
  else if(a==="unit"){var y=ped.it[c]||{q:0,u:"un"};setQ(c,y.q||0,b.dataset.u);updCard(c)}
  else if(a==="quitar"){setQ(c,0);render()}
  else if(a==="finalizar")finalizar();
  else if(a==="copiar"){var h=HIST.filter(function(x){return x.id===b.dataset.id})[0];if(h)copiar(h.txt)}
  else if(a==="ver"){var v=HIST.filter(function(x){return x.id===b.dataset.id})[0];if(v){v.ver=!v.ver;render()}}
  else if(a==="repetir"){var rp=HIST.filter(function(x){return x.id===b.dataset.id})[0];if(!rp)return;
    if(nLineas()&&!confirmar())return;
    ped=nuevo();ped.cod=rp.cod;ped.cli=rp.cli;ped.com=rp.com;ped.cl=rp.cl;ped.vend=rp.vend;ped.nuevo=!!rp.nuevo;ped.rut=rp.rut||"";ped.dir=rp.dir||"";
    rp.l.forEach(function(x){if(BYC[x.c]>=0){ped.it[x.c]={q:x.q,u:x.u};ped.ord.push(x.c)}});guardar();view="pedido";stage=2;render();window.scrollTo(0,0);toast("Pedido cargado. Ajusta las cantidades.")}
  else if(a==="otro"){stage=0;render();window.scrollTo(0,0)}
});
var pendConf=0;function confirmar(){if(Date.now()-pendConf<4000){pendConf=0;return true}pendConf=Date.now();toast("Tienes un pedido sin terminar. Toca de nuevo para reemplazarlo.");return false}
document.addEventListener("input",function(e){var t=e.target;
  if(t.id==="cq"){cq=t.value;document.getElementById("cres").innerHTML=cresHTML();return}
  if(t.id==="fq"){fq=t.value;if(fq.trim()){soloPed=false}document.getElementById("grid").innerHTML=gridHTML();return}
  if(t.dataset.qty){var c=t.dataset.qty,x=ped.it[c]||{q:0,u:"un"};var v=t.value.replace(/\D/g,"");if(v!==t.value)t.value=v;setQ(c,v,x.u);
    var card=t.closest("[data-card]");if(card){card.classList.toggle("on",!!(ped.it[c]&&ped.it[c].q));var eqx=card.querySelector(".eq");if(eqx)eqx.textContent=qtyTxt(c)}
    cartBar();var tl=document.getElementById("tot");if(tl)tl.textContent=totTxt();var tv=document.getElementById("totv");if(tv)tv.textContent=clp(total().t);return}
  if(t.dataset.in==="cli"||t.dataset.in==="rut"||t.dataset.in==="dir"||t.dataset.in==="obs"){ped[t.dataset.in]=t.value;guardar();
    var go=document.querySelector('.card [data-act="stage"][data-s="1"]');if(go&&stage===0)go.disabled=!cliOk()}});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.in==="vend"){ped.vend=t.value;guardar();render()}
  else if(t.dataset.in==="nuevo"){ped.nuevo=t.checked;if(ped.nuevo){ped.cod="";ped.com="";ped.cl="";ped.cvend="";if(!ped.cli)ped.cli=cq}guardar();render()}
  else if(t.dataset.qty&&stage===2){if(!(ped.it[t.dataset.qty]&&ped.it[t.dataset.qty].q))render()}});

if(ped.cod||ped.nuevo)stage=cliOk()?(nLineas()?1:1):0;
render();
api("getConfig").then(function(j){if(!j)return;try{var x=JSON.parse(j);if(x.eq&&x.eq.vend){eq=x.eq;save("fe_eq",eq);VN=eq.vend.map(function(v){return v.n});if(stage===0&&quieto())render()}}catch(e){}},function(){});
api("getClientes").then(function(r){CLIRAW=r||[];CLN=null;CLIERR=CLIRAW.length?"":"La planilla no tiene la maestra de clientes cargada.";try{localStorage.setItem("fe_cli",JSON.stringify(CLIRAW))}catch(e){}
  if(stage===0){var cr=document.getElementById("cres");if(cr)cr.innerHTML=cresHTML()}},function(){if(!CLIRAW.length){CLIERR="Sin conexión y sin maestra guardada en el teléfono.";var cr=document.getElementById("cres");if(cr)cr.innerHTML=cresHTML()}});
enviarCola();
window.addEventListener("online",enviarCola);
setInterval(enviarCola,60000);
</script>
</body>
</html>
