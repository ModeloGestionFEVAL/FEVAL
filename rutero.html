<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c2f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rutero · FEVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#14213a; --muted:#5a6475; --line:#d6dbe4;
  --accent:#0c2f66; --accent-ink:#ffffff; --accent-soft:#e2e8f2; --gold:#b8944a; --gold-soft:#f3ead7;
  --good:#1f7a4a; --good-soft:#dcefe3; --warn:#a86400; --warn-soft:#f6e8cf; --bad:#b3302a; --bad-soft:#f6dedc;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
    --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
    --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
    --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:1001}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:38px;width:auto;flex:none;background:#fff;border-radius:6px;padding:3px 5px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;margin:20px 0 4px}
h3{font-size:16px}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
details.sup{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
details.sup summary{list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;font:700 17px var(--display)}
details.sup summary::-webkit-details-marker{display:none}
details.sup summary::after{content:"▾";color:var(--muted);font-size:18px;transition:transform .15s}
details.sup[open] summary::after{transform:rotate(180deg)}
details.sup summary span{font:500 13px var(--body);color:var(--muted);margin-left:auto;margin-right:10px}
.vl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vb{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:13px 14px;font:500 16px var(--body);cursor:pointer}
.vb:first-child{border-top:0}
.vb span{font-size:13px;color:var(--muted);white-space:nowrap}
.vb:hover{background:var(--bg)}
.back{border:0;background:transparent;color:var(--accent);font:600 15px var(--body);padding:12px 0 0;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.days button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 2px;font:600 15px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.days button small{font:500 12px var(--body);color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -3px 0 var(--gold)}
.days button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 14px;font:600 14px var(--body);cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.grow{flex:1}
.btn.done{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.prog .tr{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--good)}
.cl{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0}
.cl .nb{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:700 14px var(--body);font-variant-numeric:tabular-nums}
.cl.vis .nb{background:var(--good);color:#fff}
.cl.vis .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.cl .nm{font-weight:600}
.cl .ds{font-size:13px;color:var(--muted)}
.cl .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-right:4px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.b{background:var(--bad-soft);color:var(--bad)}
#map{height:62vh;min-height:340px;border-radius:12px;border:1px solid var(--line);margin-top:12px;z-index:1}
.pin{width:28px;height:28px;border-radius:50%;background:#0c2f66;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:700 12px Arial,sans-serif}
.pin.v{background:#1f7a4a}.pin.d{background:#a86400}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
.leaflet-popup-content{font:14px/1.4 var(--body)}
.leaflet-popup-content a{font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:1002}
nav.tabs .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
nav.tabs a,nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:12px 6px;border-radius:8px;cursor:pointer;text-align:center;text-decoration:none}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:1003;display:none;max-width:90%;text-align:center}
.empty{padding:24px 6px;text-align:center;color:var(--muted)}
.warnbox{background:var(--warn-soft);border-radius:8px;padding:10px;font-size:14px}
input[type=search]{font:400 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;margin-top:12px}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

"use strict";
var API="https://script.google.com/macros/s/AKfycbzRdzqrBeygYI9smZPZrg9Da1uTAaQXGyYlzbH5hK816bKvRAA-u5tkqSfCamSV9Oe2zA/exec";
var SES=null;try{SES=JSON.parse(localStorage.getItem("fe_sesion")||"null")}catch(e){}
if(!SES||!SES.t)location.replace("index.html");
var ROL=SES?String(SES.rol||"").toLowerCase():"",VOL=ROL==="volante",VDR=ROL==="vendedor",PUEDE=VOL||VDR;
function api(m,a){return fetch(API,{method:"POST",body:JSON.stringify({m:m,a:a||[],t:SES?SES.t:""})}).then(function(r){if(!r.ok)throw new Error("No se pudo conectar con la planilla.");return r.json()}).then(function(j){
  if(j.auth===false){try{localStorage.removeItem("fe_sesion")}catch(e){}location.replace("index.html");throw new Error(j.error)}
  if(!j.ok)throw new Error(j.error||"Ocurrió un error.");return j.r})}
function load(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(x){return String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function p2(n){return String(n).padStart(2,"0")}
function hoy(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
var DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes"],DC=["Lu","Ma","Mi","Ju","Vi"];

var VIS=load("fe_rutv")||{};
function diaHoy(){var d=new Date().getDay();return d>=1&&d<=5?d-1:0}
function vkey(){return VEND+"|"+hoy()}
function esHoy(){return !!(DATA&&DATA.dia!=null&&DIA===DATA.dia)}
function visto(c){return !!(esHoy()&&DATA.vis&&DATA.vis[c])}
function marcar(c){var k=vkey();VIS[k]=VIS[k]||{};if(VIS[k][c])delete VIS[k][c];else VIS[k][c]=1;
  Object.keys(VIS).forEach(function(x){if(x.split("|")[1]!==hoy())delete VIS[x]});save("fe_rutv",VIS)}

  if(MAP&&!(view==="ruta"&&MAPA))quitarMapa();
  m.innerHTML=view==="ruta"?vRuta():vEquipo();
  if(view==="ruta"&&MAPA)dibujarMapa()}

/* ---------- Equipo ---------- */
function vEquipo(){var h=(VOL?'<h2>Hola, '+esc(String(SES.n).split(" ")[0])+"</h2>":"<h2>Rutero</h2>")+'<p class="sub">Elige un vendedor para ver sus clientes de lunes a viernes, en orden y con la ubicación de cada uno.</p>';
  if(!eq.vend.length)return h+'<div class="card"><p class="empty">Cargando el equipo…</p></div>';
  var sups=(eq.sups&&eq.sups.length?eq.sups:[]).slice();
  eq.vend.forEach(function(v){if(sups.indexOf(v.sup)<0)sups.push(v.sup||"Sin supervisor")});

function abrir(v){VEND=v;view="ruta";DATA=load("fe_rut_"+v);ERR="";ORD=null;ORIG=null;fq="";DIA=diaHoy();render();window.scrollTo(0,0);
  api("getRutero",[v]).then(function(r){if(VEND!==v)return;DATA=r;if(r.dia!=null&&r.dia<=4&&VEND===v&&!abrir.dfix){abrir.dfix=1;DIA=r.dia}save("fe_rut_"+v,r);ORD=null;if(view==="ruta"&&quieto())render();vigilar();chequear(null,false)},

function delDia(d){return DATA?DATA.cli.filter(function(c){return c.d&&c.d[d]}):[]}
function dist(a,b){var R=6371,x=(b.lo-a.lo)*Math.PI/180*Math.cos((a.la+b.la)/2*Math.PI/180),y=(b.la-a.la)*Math.PI/180;return R*Math.sqrt(x*x+y*y)}
/* Secuencia del día con ventanas horarias. Pegado tal cual en rutero.html. */
var SEQ={INI:540,FIN:1080,VISITA:10,KMH:18,FACTOR:1.35,FIJO:2};
function sqDist(a,b){var R=6371,x=(b.lo-a.lo)*Math.PI/180*Math.cos((a.la+b.la)/2*Math.PI/180),y=(b.la-a.la)*Math.PI/180;return R*Math.sqrt(x*x+y*y)}
function sqViaje(a,b){if(!a)return 0;var km=sqDist(a,b)*SEQ.FACTOR;return km<0.05?0:SEQ.FIJO+km/SEQ.KMH*60}
function sqMin(s){var m=/(\d{1,2})[:.h](\d{2})/.exec(s)||/^\s*(\d{1,2})\s*$/.exec(s);if(!m)return null;var h=+m[1],mi=+(m[2]||0);return h<24&&mi<60?h*60+mi:null}
/* Ventana de recepción de pedidos: [abre, cierra] en minutos. Sin dato = todo el día. */
function sqVentana(c){if(c._w)return c._w;var a=null,b=null,p=String(c.hor||"").split(/\s+a\s+|\s*-\s*/);
  if(p.length)a=sqMin(p[0]);if(p.length>1)b=sqMin(p[1]);
  if(a==null)a=0;if(b==null||b<=a)b=1440;c._w=[a,b];return c._w}
function sqSimular(r,t0,ini){var t=t0,prev=ini||null,eta=[],tarde=0,atraso=0;
  for(var i=0;i<r.length;i++){var c=r[i],w=sqVentana(c);t+=sqViaje(prev,c);if(t<w[0])t=w[0];
    eta.push(t);if(t>w[1]){tarde++;atraso+=t-w[1]}t+=SEQ.VISITA;prev=c}
  return {eta:eta,tarde:tarde,atraso:atraso,fin:t}}
function sqPeor(a,b){return a.tarde!==b.tarde?a.tarde>b.tarde:Math.abs(a.atraso-b.atraso)>0.5?a.atraso>b.atraso:a.fin>b.fin+0.01}
function sqGoloso(con,s,t0,ini){var r=[],q=con.slice(),t=t0,u=ini||null;
  if(s){q.splice(q.indexOf(s),1);r.push(s);t+=sqViaje(u,s);t=Math.max(t,sqVentana(s)[0])+SEQ.VISITA;u=s}
  while(q.length){var bi=-1,bs=1e9,bj=-1,bl=1e9;
    for(var i=0;i<q.length;i++){var c=q[i],w=sqVentana(c),ll=Math.max(t+sqViaje(u,c),w[0]);
      if(ll<=w[1]){var sc=(ll-t)+0.03*Math.min(w[1]-ll,300);if(sc<bs){bs=sc;bi=i}}
      else if(ll<bl){bl=ll;bj=i}}
    var k=bi>=0?bi:bj,c2=q.splice(k,1)[0];t=Math.max(t+sqViaje(u,c2),sqVentana(c2)[0])+SEQ.VISITA;r.push(c2);u=c2}
  return r}
/* cs: clientes del día. ini: {la,lo} si se ordena desde la ubicación actual. t0: minuto de partida. */
function secuenciar(cs,ini,t0){if(t0==null)t0=SEQ.INI;
  var con=cs.filter(function(c){return c.la!=null&&c.src!=="dudosa"}),sin=cs.filter(function(c){return !(c.la!=null&&c.src!=="dudosa")});
  var best=null,bs=null;
  if(con.length){
    var starts=ini?[null]:con.slice().sort(function(a,b){return sqVentana(a)[0]-sqVentana(b)[0]}).slice(0,Math.min(con.length,40));
    starts.forEach(function(s){var r=sqGoloso(con,s,t0,ini),sm=sqSimular(r,t0,ini);if(!bs||sqPeor(bs,sm)){best=r;bs=sm}});
    /* Mejora 2-opt: invierte tramos si no aumenta los atrasos y acorta el día. */
    var mejoro=true,it=0;
    while(mejoro&&it<25){mejoro=false;it++;
      for(var i=0;i<best.length-1;i++)for(var j=i+1;j<best.length;j++){
        var cand=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1)),sm=sqSimular(cand,t0,ini);
        if(sqPeor(bs,sm)){best=cand;bs=sm;mejoro=true}}}
    /* Mejora "mover uno": saca un cliente y lo prueba en otra posición. */
    mejoro=true;it=0;
    while(mejoro&&it<10){mejoro=false;it++;
      for(var a=0;a<best.length;a++)for(var b=0;b<best.length;b++){if(a===b)continue;
        var cc=best.slice(),x=cc.splice(a,1)[0];cc.splice(b,0,x);var s2=sqSimular(cc,t0,ini);
        if(sqPeor(bs,s2)){best=cc;bs=s2;mejoro=true}}}
  }
  var out=(best||[]).map(function(c,i){return {c:c,eta:bs.eta[i],tarde:bs.eta[i]>sqVentana(c)[1],fuera:bs.eta[i]>=SEQ.FIN}});
  sin.forEach(function(c){out.push({c:c,eta:null,tarde:false,fuera:false})});
  return {r:out,tarde:bs?bs.tarde:0,fin:bs?bs.fin:null,ini:t0}}
function sqHora(m){if(m==null)return "";m=Math.round(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function lista(){var k=DIA+"|"+(ORIG?"g":"");if(!ORD||ORD.k!==k||ORD.n!==(DATA?DATA.cli.length:0)){

  ORD={k:k,n:DATA?DATA.cli.length:0,r:sq.r.map(function(x){return x.c}),m:m,s:sq}}return ORD.r}
