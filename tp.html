<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c2f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tienda Perfecta · FEVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de teléfono; cabecera con puntaje en vivo, pasos de la salida arriba, navegación fija abajo. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#14213a; --muted:#5a6475; --line:#d6dbe4;
  --accent:#0c2f66; --accent-ink:#ffffff; --accent-soft:#e2e8f2; --gold:#b8944a; --gold-soft:#f3ead7;
  --good:#1f7a4a; --good-soft:#dcefe3; --warn:#a86400; --warn-soft:#f6e8cf; --bad:#b3302a; --bad-soft:#f6dedc;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
    --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
    --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1422; --surface:#152135; --ink:#e7ecf5; --muted:#9aa8c0; --line:#2a3a55;
  --accent:#9bb9ec; --accent-ink:#0a1c3a; --accent-soft:#1d2e4d; --gold:#d4b26a; --gold-soft:#3a3120;
  --good:#6fcf97; --good-soft:#1b3a2a; --warn:#f0b455; --warn-soft:#40321a; --bad:#f08a84; --bad-soft:#452321;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px}
.wrap{max-width:580px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:38px;width:auto;flex:none;background:#fff;border-radius:6px;padding:3px 5px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.live{text-align:right;font-variant-numeric:tabular-nums}
.live b{font-family:var(--display);font-size:24px;line-height:1}
.live span{display:block;font-size:12px;color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;margin:20px 0 4px}
h3{font-size:16px;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin:14px 0 0}
.steps button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 4px;font:500 12px var(--body);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);color:var(--accent-ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea{font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:64px;resize:vertical}
select{font:400 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:55%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:20px}
.blockhead span{font-size:13px;color:var(--muted);white-space:nowrap}
.item{border-top:1px solid var(--line);padding:12px 0 2px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item-t{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.num{flex:none;width:24px;height:24px;border-radius:6px;background:var(--gold-soft);color:var(--ink);font:700 13px var(--display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tag{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.crit{background:var(--bad-soft);color:var(--bad)}
.tag.ej{background:var(--warn-soft);color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 6px;font:500 14px var(--body);cursor:pointer;min-height:44px}
.seg button[data-v="na"]{color:var(--muted);padding:10px 12px}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);border-color:var(--warn);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.add{border-style:dashed;color:var(--accent)}
.oflab{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.ofs{display:flex;flex-wrap:wrap;gap:6px}
.ofs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;min-height:38px}
.ofs button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.ofs button[aria-pressed="true"]::before{content:"\2713\00a0"}
.lrow{display:flex;gap:8px;align-items:center}
.ed .l{flex-wrap:wrap}
.seg.seg2{grid-template-columns:1fr 1fr}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left}
.lrow select{max-width:38%}
.cresw{display:flex;flex-direction:column;gap:6px}
.cres{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:400 15px var(--body);cursor:pointer}
.cres span{font-size:13px;color:var(--muted)}
.foto{max-width:100%;max-height:280px;border-radius:10px;border:1px solid var(--line);display:block}
.foto.exito{max-height:none;width:100%}
.filebtn{display:inline-block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.lrow:has(>.vh:focus-visible) .filebtn{outline:3px solid var(--accent);outline-offset:2px}
details.card>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.catg{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.catg>summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.catg>summary .cnt{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.catg[open]>summary{margin-bottom:8px}
.catg>*+*{margin-top:8px}
.irow{display:grid;grid-template-columns:84px 1fr auto;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.irow select{grid-column:1/-1;max-width:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mgrid.g2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mfig{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:space-between}
.mfig img{max-width:100%;max-height:160px;object-fit:contain}
.mfig figcaption{font-size:13px;font-weight:600;color:#14213a;text-align:center}
.mfig figcaption span{font-weight:400;color:#5a6475}
.mb{display:inline-block;background:var(--gold);color:#14213a;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;margin-left:2px}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.tiles.t4{grid-template-columns:repeat(2,1fr)}}
.f select{max-width:100%;width:100%}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card .icard{margin-top:0;background:var(--bg)}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ihead .pill{white-space:nowrap}
.m{font-size:13px;color:var(--muted)}
.arow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.atop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tag.okk{background:var(--good-soft);color:var(--good)}
.seg.s4{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.seg.s4{grid-template-columns:repeat(2,1fr)}}
.seg button.c-good[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.seg button.c-warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface);font-weight:600}
.seg button.c-bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:600}
.vbtn,.vname{background:none;border:0;padding:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;text-align:left}
.vbtn::before{content:"\25B8\00a0"}
.vbtn[aria-expanded="true"]::before{content:"\25BE\00a0"}
.vname{font-size:14.5px;text-decoration:underline;text-underline-offset:2px}
tr.vdet>td{text-align:left;background:var(--bg);padding:6px 10px 10px}
.vli{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:4px}
.vm{display:flex;flex-wrap:wrap;gap:4px}
.mchip{font-size:12px;border-radius:999px;padding:2px 8px;font-weight:500}
.mchip.n1{background:var(--good-soft);color:var(--good)}
.mchip.n2{background:var(--bad-soft);color:var(--bad)}
.mchip.n0{background:var(--line);color:var(--ink)}
#brandt{font-size:15px;line-height:1.2}
nav.tabs a.navlink{flex:1;text-align:center;color:var(--muted);font:600 14px var(--body);padding:12px 6px;border-radius:8px;text-decoration:none}
.sosw{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:10px}
.sosr{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:end;font-size:14px;font-weight:600}
.sosr label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:500;color:var(--muted)}
.sosr input{width:100%;font:400 16px var(--body);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.sosp{margin:0;font-size:14px}
.cmp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cmp:first-of-type{border-top:0;padding-top:0}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:4px}
.seg button.c-good[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.seg button.c-bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:600}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:13px 14px;font:600 15px var(--body);cursor:pointer;min-width:140px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{flex:none;min-width:0;padding:8px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.score{display:flex;align-items:center;gap:16px}
.score .big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.bar i{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.bar i b{display:block;height:100%;border-radius:4px}
.bar .v{font-weight:600;font-variant-numeric:tabular-nums}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.fb{border-left:4px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.fb.ok{border-color:var(--good)}
.fb .k{font-weight:600}
.fb .d{font-size:14px;color:var(--muted)}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.hist:first-child{border-top:0;padding-top:0}
.hist .n{font:800 24px var(--display);font-variant-numeric:tabular-nums}
.hist .m{font-size:13px;color:var(--muted)}
.ed{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ed:first-of-type{border-top:0;padding-top:0}
.ed .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ed .l label{display:flex;align-items:center;gap:6px}
.wt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.wt input{width:76px}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav.tabs .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:12px 6px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;display:none;max-width:90%}
@media (max-width:380px){.row2{grid-template-columns:1fr}.seg button{font-size:13px;padding:10px 2px}}

/* ---------- Fondo sutil de toda la app (puntos azules y dorados) ---------- */
html{background:var(--bg)}
body:not(.lg){background:transparent}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,rgba(43,95,184,.42) 1.3px,transparent 1.8px),radial-gradient(circle,rgba(184,148,74,.5) 1.5px,transparent 2px),radial-gradient(circle,rgba(43,95,184,.22) 1px,transparent 1.5px);
  background-size:150px 150px,240px 240px,95px 95px;background-position:0 0,70px 110px,35px 25px;animation:fxd 90s ease-in-out infinite alternate}
@keyframes fxd{to{transform:translate3d(-4%,-3%,0)}}
body.lg::before{display:none}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>

function calc(){
  var o={pil:{},gaps:[],falt:[],crit:[],ans:0,cnt:0},ws=0,acc=0;
  PK.forEach(function(k){var u=[];
    if(k==="sur")P.inf.forEach(function(x){if(!x.n||!aplica(x))return;o.cnt++;if(!ev.rev[iCat(x)])return;
      var v=ev.inf[iKey(x)]?1:0;o.ans++;u.push(v);if(!v)o.falt.push(x)});
    P[k].forEach(function(it){o.cnt++;var v=ev.sc[it.id];if(v!==undefined)o.ans++;
      if(typeof v==="number"){u.push(v/2);if(v<2){o.gaps.push({k:k,t:it.t,fb:it.fb,r:v/2,crit:!!it.crit});if(it.crit)o.crit.push(it.t)}}});
    var r=u.length?u.reduce(function(a,b){return a+b},0)/u.length:null;o.pil[k]=r;
    var w=Number(P.pesos[k])||0;if(r!==null){ws+=w;acc+=w*r}});
  o.total=ws?Math.round(acc/ws*100):null;
  if(P.critInf&&o.falt.length)o.crit.unshift(o.falt.length===1?"Falta 1 infaltable":"Faltan "+o.falt.length+" infaltables");
  o.perfecta=o.total!==null&&o.total>=90&&!o.crit.length;
  o.gaps.sort(function(a,b){return (b.crit?1:0)-(a.crit?1:0)||a.r-b.r||(Number(P.pesos[b.k])||0)-(Number(P.pesos[a.k])||0)});
  o.prio=o.gaps.slice(0,3);

}

function resumen(c){
  var nv=nivelC(c),L=[];
  L.push("*Tienda Perfecta Feval* · "+fechaCL(ev.fecha));
  L.push("Tienda: "+(ev.cli||"-")+(ev.cod?" ["+ev.cod+"]":"")+(ev.cluster?" (cluster "+ev.cluster+")":"")+(ev.ruta?" · Ruta: "+ev.ruta:""));
  L.push("Vendedor: "+(ev.vend||"-")+" · Supervisor: "+(ev.sup||"-"));
  L.push("Puntaje: "+c.total+"/100 ("+nv[0]+")");
  if(c.crit.length)L.push("Críticos sin cumplir: "+c.crit.join("; "));
  if(sosCalc()!==null)L.push("Participación Nestlé en góndola: "+sosCalc()+" % (meta "+P.metaSos+" %)");
  var up=ev.cod&&ULT?ULT[ev.cod]:null;if(up)L.push("Auditoría anterior: "+fechaCL(up.f)+" · "+up.t+" pts");
  var mi=muebInst();L.push("Muebles Nestlé instalados: "+(mi.length?mi.join(", "):"ninguno registrado"));
  var ici=ICX[ev.cod];if(ici!==undefined)L.push("Censo de inventario: "+ICA[ici].map(function(ai){var e=CEN[aKey(ai)];return TIP[IA[ai][1]]+" QR "+IA[ai][0]+" "+(e?CST[e.st][0].toLowerCase():"sin censar")}).join("; "));
  PK.forEach(function(k){L.push("- "+PIL[k]+": "+pct(c.pil[k]))});
  if(c.falt.length){L.push("");L.push("*Infaltables que faltan*");faltCat(c.falt).forEach(function(g){L.push("- "+g.cat+" ("+g.it.length+"): "+g.it.join(", "))})}
  if(c.prio.length){L.push("");L.push("*Qué mejorar primero*");c.prio.forEach(function(x,i){L.push((i+1)+". "+x.t+": "+x.fb)});if(c.gaps.length>3)L.push("(y "+(c.gaps.length-3)+" brechas más)")}
  var cpo=compOk();if(cpo.length){L.push("");L.push("*Compromisos*");cpo.forEach(function(x,i){L.push((i+1)+". "+compTxt(x))})}
  var rv=revComp();if(rv){var ok=rv.items.filter(function(x){return x.st==="si"}).length;L.push("");L.push("*Compromisos anteriores ("+fechaCL(rv.f)+")*: "+ok+" de "+rv.items.length+" cumplidos")}
  if(ev.obs){L.push("");L.push("*Observaciones*");L.push(ev.obs)}
  return L.join("\n");
}

  else if(a==="clrcen"){if(!clrArm){clrArm=true;b.textContent="Toca de nuevo para borrar todo el censo";return}clrArm=false;CEN={};XTR={};save("tp_censo",CEN);save("tp_extra",XTR);render();toast("Censo borrado en este dispositivo.")}
  else if(a==="mue"){if(ev.mue[d.k])delete ev.mue[d.k];else ev.mue[d.k]=true;b.setAttribute("aria-pressed",String(!!ev.mue[d.k]));save("tp_eval_n1",ev)}
  else if(a==="delfx"){delete FX[d.v];save("tp_fotos",FX);render()}
  else if(a==="cluster"){ev.cluster=ev.cluster===d.v?"":d.v;save("tp_eval_n1",ev);render()}
  else if(a==="copy"){var ta=document.getElementById("f-res");
    try{navigator.clipboard.writeText(ta.value).then(function(){toast("Resumen copiado. Pégalo en WhatsApp.")},function(){ta.select();toast("Selecciona el texto y cópialo.")})}
    catch(err){ta.select();toast("Selecciona el texto y cópialo.")}}
  else if(a==="fin"){var c=calc();
    if(c.total===null){toast("No hay ítems evaluados todavía.");return}
    if(!ev.sup||!ev.cli){toast("Falta elegir supervisor y tienda en la etapa 1.");return}
    if(!ev.foto){toast("Falta la foto de la góndola (etapa 1).");return}
    var pp=function(r){return r===null?null:Math.round(r*100)},pl={};PK.forEach(function(k){pl[k]=pp(c.pil[k])});
    var dat={sup:ev.sup,vend:ev.vend,fecha:ev.fecha,ruta:ev.ruta,cod:ev.cod,cli:ev.cli,com:ev.com,cluster:ev.cluster,clraw:ev.clraw,total:c.total,nivel:nivelC(c)[0],perfecta:c.perfecta,crit:c.crit,sos:{cats:ev.sos||{},pct:sosCalc(),meta:P.metaSos},pil:pl,
      falt:faltCat(c.falt),gaps:c.gaps.map(function(x){return {t:x.t,fb:x.fb,pil:PIL[x.k]}}),muebles:muebInst(),obs:ev.obs||"",prio:c.prio.map(function(x){return {t:x.t,fb:x.fb,pil:PIL[x.k],crit:x.crit}}),comp:compOk().map(function(x){return {t:String(x.t).trim(),q:x.q,f:x.f}}),crev:revComp(),resp:{sc:ev.sc,inf:ev.inf,rev:ev.rev},foto:ev.foto};
    var volver=function(m){b.disabled=false;b.textContent="Enviar y auditar otra tienda";toast(m)};
    b.disabled=true;b.textContent="Obteniendo ubicación…";
    ubicar(function(g){dat.gps=g;b.textContent="Enviando…";
      api("guardarAuditoria",[dat]).then(function(r){
        if(!r||!r.ok){volver((r&&r.error)||"No se pudo guardar. Intenta de nuevo.");return}
        if(ULT&&dat.cod)ULT[dat.cod]={r:"9",f:dat.fecha,t:dat.total,n:dat.nivel,s:dat.sup,c:dat.comp};
        ev=nueva(ev);save("tp_eval_n1",ev);srvTP=null;stage=0;render();window.scrollTo(0,0);
        toast("Auditoría enviada"+(r.dist===null||r.dist===undefined?(g?".":", sin ubicación."):" a "+(r.dist>=1000?(r.dist/1000).toFixed(1).replace(".",",")+" km":r.dist+" m")+" de la tienda."))},
        function(){volver("No se pudo enviar. La auditoría no se pierde: toca de nuevo cuando tengas señal.")})})}
  else if(a==="rehist"){srvTP=null;srvTPerr="";render()}
  else if(a==="pubtp"){var cl=document.getElementById("f-clave").value;if(!cl){toast("Escribe la clave de administrador.");return}
    b.disabled=true;api("setConfigTP",[JSON.stringify(P),cl]).then(function(r){b.disabled=false;toast(r&&r.ok?"Estándar publicado para todos.":((r&&r.error)||"No se pudo publicar."))},function(){b.disabled=false;toast("No se pudo publicar. Revisa la conexión.")})}
  else if(a==="clearhist"){hist=[];save("tp_hist",hist);render()}
  else if(a==="addinf"){P.inf.push({c:"",n:"",cat:d.cat||"Otros",cl:"A"});openEd=d.cat||"Otros";save("tp_pauta_n1",P);render();var ni=document.getElementById("ik-"+(P.inf.length-1));if(ni)ni.focus()}
  else if(a==="delinf"){openEd=iCat(P.inf[Number(d.i)]);P.inf.splice(Number(d.i),1);save("tp_pauta_n1",P);render()}
  else if(a==="additem"){P[d.blk].push({id:"x"+Date.now(),t:"Nuevo ítem",fb:""});save("tp_pauta_n1",P);render()}
  else if(a==="delitem"){P[d.blk].splice(Number(d.i),1);save("tp_pauta_n1",P);render()}
  else if(a==="resetpauta"){P=migP(clone(DEF));save("tp_pauta_n1",P);render();toast("Estándar de ejemplo restaurado.")}
});

  if(t.dataset.mq){MF.q=t.value;MF.n=25;var ml=document.getElementById("mlist");if(ml)ml.innerHTML=listHTML(mfClients());return}

    if(k==="cli"){ev.cod="";ev.com="";ev.clraw="";ev.cvend="";var rr=document.getElementById("cli-res");if(rr)rr.innerHTML=resHTML(t.value)}
    save("tp_eval_n1",ev);return}
  if(t.dataset.exd){P.exito[t.dataset.exd]=t.value;save("tp_pauta_n1",P);return}
  if(t.dataset.cp!==undefined){compList()[Number(t.dataset.cp)][t.dataset.f]=t.value;save("tp_eval_n1",ev);var rs=document.getElementById("f-res");if(rs)rs.value=resumen(calc());return}
  if(t.dataset.sos){ev.sos=ev.sos||{};var sc0=t.dataset.sos;ev.sos[sc0]=ev.sos[sc0]||{};ev.sos[sc0][t.dataset.f]=t.value;sosAuto();save("tp_eval_n1",ev);
    var spp=document.getElementById("sos-p");if(spp)spp.innerHTML=sosTxt(sosCalc());var si=sosItem();
    if(si)document.querySelectorAll('[data-act="score"][data-id="'+si.id+'"]').forEach(function(x){x.setAttribute("aria-pressed",String(ev.sc[si.id])===x.dataset.v?"true":"false")});live();return}
  if(t.dataset.pr){P[t.dataset.pr]=t.type==="checkbox"?t.checked:Math.max(0,Math.min(100,Number(t.value)||0));save("tp_pauta_n1",P);return}
  if(t.dataset.ed){P[t.dataset.blk][Number(t.dataset.i)][t.dataset.ed]=t.type==="checkbox"?t.checked:t.value;save("tp_pauta_n1",P);return}
  if(t.dataset.inf){P.inf[Number(t.dataset.i)][t.dataset.inf]=t.dataset.inf==="n"?t.value.trim():t.value;save("tp_pauta_n1",P);return}
  if(t.dataset.w){P.pesos[t.dataset.w]=Math.max(0,Number(t.value)||0);save("tp_pauta_n1",P)}
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.cp!==undefined){compList()[Number(t.dataset.cp)][t.dataset.f]=t.value;save("tp_eval_n1",ev);var rs2=document.getElementById("f-res");if(rs2)rs2.value=resumen(calc());return}
  if(t.id==="f-fotog"){if(t.files&&t.files[0])cargarFotoG(t.files[0]);return}

  if(t.dataset.bulk){if(!t.value)return;P.inf.forEach(function(x){if(iCat(x)===t.dataset.bulk)x.cl=t.value});openEd=t.dataset.bulk;save("tp_pauta_n1",P);render();toast("Categoría "+t.dataset.bulk+" asignada.");return}
